[project]
name = "ser_project"
version = "0.1.0"
description = "SER, Online Emotion VAD Prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.11.*",
    "torchaudio==2.11.*",
    "transformers>=5.14.1",
    "bitsandbytes>=0.45.0",
    "accelerate>=1.1.0",
    "datasets>=5.0.0",
    "kernels>=0.16.0",
    "soundfile>=0.14.0",
    "scipy>=1.18.0",
    "matplotlib>=3.11.0",
    "wandb>=0.28.1",
    "torchao>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "ipykernel>=7.3.0",
    "jupyter-client>=8.9.1",
    "ipywidgets>=8.1.8",
    "ipywebrtc>=0.6.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchaudio = [
    { index = "pytorch-cu128" },
]

[tool.uv.extra-build-dependencies]
flash-attn = [ "torch" ]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
