[project]
name = "ser_project"
version = "0.1.0"
description = "SER, Online Emotion VAD Prediction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.11.*",
    "torchaudio==2.11.*",
    "transformers>=5.14.1",
    "huggingface-hub>=1.0.0",
    "bitsandbytes>=0.45.0",
    "accelerate>=1.1.0",
    "datasets>=5.0.0",
    "kernels>=0.16.0",
    "soundfile>=0.14.0",
    "numpy>=2.0.0",
    "scipy>=1.18.0",
    "tqdm>=4.67.0",
    "matplotlib>=3.11.0",
    "wandb>=0.28.1",
    "torchao>=0.17.0",
    "crisperwhisper[ct2]>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "ipykernel>=7.3.0",
    "jupyter-client>=8.9.1",
    "ipywidgets>=8.1.8",
    "ipywebrtc>=0.6.0",
]
# Transcription backend for ser_project.datasets.pseudo_label.
pseudo-label = [
    "crisperwhisper[ct2]>=2.0.2",
]
# Needed by the corpus utility split_conv_audio; librosa is deliberately left out because it
# constrains numpy through numba, and it is only reached by a fallback branch of that utility.
corpus-audio = [
    "pydub>=0.25.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchaudio = [
    { index = "pytorch-cu128" },
]

[tool.uv.extra-build-dependencies]
flash-attn = [ "torch" ]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["."]
python_files = ["test_*.py"]
# The project is a uv virtual (non-installed) package, so collection starts at the repository
# root. Everything that is not source has to be pruned explicitly, the corpus directory above
# all: it holds tens of thousands of audio and annotation files.
norecursedirs = [
    ".*",
    "__pycache__",
    "build",
    "data",
    "dist",
    "docs",
    "node_modules",
    "outputs",
    "wandb",
    "*.egg",
]
